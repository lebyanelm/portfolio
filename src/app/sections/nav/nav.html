<header class="bar">
  <a class="logo" routerLink="/" fragment="top">
    <span aria-hidden="true">LL</span>
    <span class="sr-only">{{ site.name }}, home</span>
  </a>

  <nav class="desktop-nav" aria-label="Primary">
    @for (link of site.nav; track link.fragment) {
      <a [routerLink]="['/']" [fragment]="link.fragment">{{ link.label }}</a>
    }
  </nav>

  <div class="bar-actions">
    <button
      type="button"
      class="theme-toggle"
      [attr.aria-pressed]="dark()"
      aria-label="Dark mode"
      (click)="toggleTheme()"
    >
      <span class="theme-knob" aria-hidden="true"></span>
    </button>

    <a class="cta bar-cta" routerLink="/" fragment="contact" appMagnetic>Get in touch</a>

    <button
      type="button"
      class="burger"
      [attr.aria-expanded]="open()"
      aria-controls="site-menu"
      (click)="toggle()"
    >
      <span class="burger-icon" [class.is-open]="open()" aria-hidden="true"></span>
      <span class="sr-only">{{ open() ? 'Close menu' : 'Open menu' }}</span>
    </button>
  </div>

  <div class="menu" id="site-menu" [hidden]="!open()">
    <nav aria-label="Mobile">
      @for (link of site.nav; track link.fragment) {
        <a [routerLink]="['/']" [fragment]="link.fragment" (click)="close()">{{ link.label }}</a>
      }
    </nav>
    <a class="menu-cta" routerLink="/" fragment="contact" (click)="close()">Get in touch</a>
  </div>
</header>
