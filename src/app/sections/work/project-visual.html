@switch (visual()) {
  @case ('arcs') {
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle
        cx="76"
        cy="22"
        r="30"
        fill="none"
        stroke="currentColor"
        stroke-width="0.55"
        opacity="0.75"
      />
      <circle
        cx="76"
        cy="22"
        r="18"
        fill="none"
        stroke="currentColor"
        stroke-width="0.55"
        opacity="0.45"
      />
      <circle cx="76" cy="22" r="7" fill="var(--accent)" />
      <circle cx="16" cy="84" r="24" fill="var(--accent)" />
      <path d="M0 58h100M0 70h100" stroke="currentColor" stroke-width="0.35" opacity="0.4" />
    </svg>
  }
  @case ('grid') {
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g stroke="currentColor" stroke-width="0.25" opacity="0.35">
        <path d="M20 0v100M40 0v100M60 0v100M80 0v100M0 20h100M0 40h100M0 60h100M0 80h100" />
      </g>
      <rect x="8" y="64" width="26" height="26" fill="var(--accent)" />
      <text
        x="8"
        y="28"
        fill="currentColor"
        font-size="14"
        font-family="IBM Plex Mono, ui-monospace, monospace"
      >
        01
      </text>
      <text
        x="48"
        y="28"
        fill="currentColor"
        font-size="14"
        font-family="IBM Plex Mono, ui-monospace, monospace"
        opacity="0.45"
      >
        02
      </text>
    </svg>
  }
  @case ('routes') {
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M6 78C28 78 26 18 94 22" fill="none" stroke="var(--accent)" stroke-width="1.5" />
      <path d="M12 16L74 90" stroke="currentColor" stroke-width="0.45" opacity="0.55" />
      <circle cx="30" cy="50" r="2.6" fill="currentColor" />
      <circle cx="68" cy="32" r="6" fill="none" stroke="currentColor" stroke-width="0.6" />
      <rect
        x="64"
        y="62"
        width="22"
        height="22"
        fill="none"
        stroke="var(--accent)"
        stroke-width="0.7"
      />
    </svg>
  }
  @case ('blobs') {
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle cx="32" cy="40" r="28" fill="var(--accent)" opacity="0.9" />
      <circle cx="64" cy="46" r="24" fill="currentColor" opacity="0.16" />
      <circle cx="48" cy="70" r="20" fill="currentColor" opacity="0.22" />
      <circle cx="78" cy="22" r="8" fill="currentColor" opacity="0.55" />
    </svg>
  }
  @case ('columns') {
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g>
        <rect x="10" y="50" width="8" height="36" fill="currentColor" opacity="0.35" />
        <rect x="22" y="32" width="8" height="54" fill="currentColor" opacity="0.55" />
        <rect x="34" y="40" width="8" height="46" fill="currentColor" opacity="0.4" />
        <rect x="46" y="18" width="8" height="68" fill="var(--accent)" />
        <rect x="58" y="44" width="8" height="42" fill="currentColor" opacity="0.5" />
        <rect x="70" y="26" width="8" height="60" fill="currentColor" opacity="0.7" />
        <rect x="82" y="54" width="8" height="32" fill="currentColor" opacity="0.35" />
      </g>
      <path d="M6 90h88" stroke="currentColor" stroke-width="0.45" opacity="0.6" />
    </svg>
  }
}
