<section class="logos" id="work" aria-labelledby="work-heading">
  <header class="intro">
    <p class="index">03 — Work</p>
    <h2 id="work-heading">Selected work</h2>
    <p class="lede">Logos, websites, and apps. Each one opens as its own case study.</p>
  </header>

  @for (group of groups; track group.id) {
    <section class="group" [attr.aria-labelledby]="'group-' + group.id">
      <h3 [id]="'group-' + group.id">{{ group.title }}</h3>
      <ul class="grid">
        @for (logo of group.items; track logo.id) {
          <li>
            <a class="tile" [routerLink]="['/work', logo.id]" data-cursor="View">
              <app-logo-mark class="tile-mark" [name]="logo.file" [label]="logo.name" />
              <span class="name">{{ logo.name }}</span>
              <span class="meta-row">
                <span class="tag">{{ logo.tag }}</span>
                @if (chip[logo.id]; as label) {
                  <span class="discipline">{{ label }}</span>
                }
              </span>
            </a>
          </li>
        }
      </ul>
    </section>
  }
</section>
