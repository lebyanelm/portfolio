    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem('theme');
          } catch (err) {}
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta)
            themeMeta.setAttribute('content', theme === 'dark' ? '#000000' : '#f3efe7');
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var desktop = window.matchMedia('(min-width: 900px)').matches;
          var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
          if (!reduce) root.classList.add('motion');
          if (!reduce && desktop) root.classList.add('motion-desktop');
          if (!reduce && fine) root.classList.add('has-cursor');
          if (reduce) root.classList.add('reduced');
          window.setTimeout(function () {
            if (!document.body || !document.body.classList.contains('app-ready')) {
              root.classList.remove('motion');
            }
          }, 4000);
        } catch (e) {}
      })();
    </script>
    <style>
      :root[data-theme='dark'] {
